<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resource Coordination | DisasterConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .brand span {
            color: #ef4444;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: white;
        }

        .dashboard-btn {
            background: #ef4444;
            color: white !important;
            padding: 10px 16px;
            border-radius: 7px;
        }

        /* ================================
           PAGE HEADER
        ================================= */

        .page-header {
            background: linear-gradient(
                135deg,
                #111827,
                #1f2937
            );

            color: white;
            padding: 45px 7%;
        }

        .page-header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #d1d5db;
            max-width: 700px;
            line-height: 1.6;
        }

        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {
            width: 86%;
            max-width: 1300px;
            margin: 35px auto;
        }

        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        .stat-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
        }

        /* ================================
           ADD RESOURCE
        ================================= */

        .panel {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ef4444;
        }

        .submit-btn {
            margin-top: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .submit-btn:hover {
            background: #dc2626;
        }

        /* ================================
           TOOLBAR
        ================================= */

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar select {
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
            outline: none;
        }

        .toolbar input {
            min-width: 250px;
        }

        /* ================================
           RESOURCE GRID
        ================================= */

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .resource-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }

        .resource-card:hover {
            transform: translateY(-3px);
        }

        .resource-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .resource-name {
            font-size: 18px;
            font-weight: 700;
        }

        .badge {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 20px;
            font-weight: 700;
        }

        .available {
            background: #dcfce7;
            color: #166534;
        }

        .low-stock {
            background: #fef3c7;
            color: #92400e;
        }

        .out-of-stock {
            background: #fee2e2;
            color: #991b1b;
        }

        .resource-info {
            display: grid;
            gap: 9px;
            color: #6b7280;
            font-size: 13px;
        }

        .resource-info strong {
            color: #374151;
        }

        .resource-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .status-btn {
            background: #e5e7eb;
        }

        .delete-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================================
           EMPTY STATE
        ================================= */

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 50px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .empty-state h3 {
            color: #374151;
            margin-bottom: 8px;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .resource-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .page-header {
                padding: 35px 5%;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .container {
                width: 92%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .resource-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar input {
                width: 100%;
                min-width: 0;
            }

            .toolbar select {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <!-- ================================
         NAVBAR
    ================================= -->

    <nav class="navbar">

        <div class="brand">
            Disaster<span>Connect</span>
        </div>

        <div class="nav-links">

            <a href="/dashboard.html">

            </a>

            <a href="/resources.html" class="dashboard-btn">
                Resources
            </a>

            <a href="/logout">

            </a>

        </div>

    </nav>

    <!-- ================================
         PAGE HEADER
    ================================= -->

    <section class="page-header">

        <h1>
            Resource Coordination
        </h1>

        <p>
            Manage emergency resources, monitor availability,

        </p>

    </section>

    <main class="container">

        <!-- ================================
             STATISTICS
        ================================= -->

        <section class="stats">

            <div class="stat-card">
                <div class="stat-label">
                    Total Resources
                </div>

                <div class="stat-value" id="totalResources">

            <div class="stat-card">

            <div class="stat-card">

                </div>

                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Out of Stock
                </div>

                <div class="stat-value" id="outOfStockResources">
                    0

            </div>

        </section>

        <!-- ================================
             ADD RESOURCE
        ================================= -->

        <section class="panel" id="addResourcePanel">

            <h2>
                Add New Resource
            </h2>
<form id="resourceForm">
            

                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Resource Name
                        </label>

                        <input
                            type="text"

                            name="name"
                            placeholder="e.g. Drinking Water"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="WATER">
                                Water
                            </option>

                            <option value="FOOD">
                                Food
                            </option>

                            <option value="MEDICAL">
                                Medical
                            </option>

                            <option value="CLOTHING">
                                Clothing
                            </option>

                            <option value="SHELTER">
                                Shelter
                            </option>

                            <option value="TRANSPORT">
                                Transport
                            </option>

                            <option value="OTHER">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="0"
                            step="0.01"
                            placeholder="e.g. 500"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="unit">
                            Unit
                        </label>

                        <input
                            type="text"
                            id="unit"
                            name="unit"
                            placeholder="e.g. litres"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="e.g. Kochi"
                            required
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Add Resource
                </button>

            </form>

        </section>

        <!-- ================================
             RESOURCE LIST
        ================================= -->

        <section class="panel">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search resources..."
                >

                <select id="categoryFilter">

                    <option value="">
                        All Categories
                    </option>

                    <option value="WATER">
                        Water
                    </option>

                    <option value="FOOD">
                        Food
                    </option>

                    <option value="MEDICAL">
                        Medical
                    </option>

                    <option value="CLOTHING">
                        Clothing
                    </option>

                    <option value="SHELTER">
                        Shelter
                    </option>

                    <option value="TRANSPORT">
                        Transport
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

                <select id="statusFilter">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="AVAILABLE">
                        Available
                    </option>

                    <option value="LOW_STOCK">
                        Low Stock
                    </option>

                    <option value="OUT_OF_STOCK">
                        Out of Stock
                    </option>

                    <option value="RESERVED">
                        Reserved
                    </option>

                    <option value="DISTRIBUTED">
                        Distributed
                    </option>

                </select>

            </div>

            <div
                id="resourceGrid"

            >
                <!-- Resources will be loaded here -->
            </div>

        </section>

    </main>
    <!-- ================================
     RESOURCE STATUS MODAL
================================= -->

<div

        display: none;

        background: rgba(15, 23, 42, 0.65);

>

    <div
        style="
            width: 100%;
            max-width: 460px;

            border-radius: 16px;
            padding: 28px;

        "
    >

        <h2

                margin-bottom: 8px;

                font-size: 22px;
            "
        >
            Change Resource Status
        </h2>

        <p
            id="statusResourceName"

                color: #6b7280;
                margin-bottom: 22px;
                font-size: 14px;
            "
        >
            Resource
        </p>

        <label

                display: block;
                font-size: 13px;

                color: #374151;

            "

            New Status

        <select

                outline: none;

            "
        >

            <option value="AVAILABLE">
                Available
            </option>

            <option value="LOW_STOCK">
                Low Stock
            </option>

            <option value="OUT_OF_STOCK">
                Out of Stock
            </option>

            <option value="RESERVED">
                Reserved
            </option>

            <option value="DISTRIBUTED">
                Distributed
            </option>

        </select>

        <div
            style="
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            "
        >

            <button

                style="
                    border: 1px solid #d1d5db;
                    background: white;
                    color: #374151;
                    padding: 10px 18px;
                    border-radius: 8px;

            </button>

            <button

                Update Status

</div>


<!-- ================================

<!-- ================================
     JAVASCRIPT
================================= -->
<script>

    let resources = [];
    let selectedResourceId = null;
   
    let toastTimer = null;
    let currentUserRole = "";
async function loadCurrentUser() {

    try {

        const response = await fetch("/api/me");

        if (!response.ok) {
            console.error("Unable to load current user");
            return;
        }

        const user = await response.json();

        currentUserRole = user.role;

        console.log("Current user role:", currentUserRole);

    } catch (error) {

        console.error(
            "Error loading current user:",
            error
        );
    }
}
function applyRoleBasedResourceForm() {
    const panel =
        document.getElementById("addResourcePanel");

    if (!panel) {
        return;
    }

    if (
        currentUserRole === "ADMIN" ||
        currentUserRole === "COORDINATOR"
    ) {
        panel.style.display = "";
    } else {
        panel.style.display = "none";
    }
}

    /* ================================
       LOAD RESOURCES
    ================================= */

    async function loadResources() {

        try {

            const response =
                await fetch("/api/resources");

            if (!response.ok) {
                throw new Error(
                    "Failed to load resources"
                );
            }

            resources =
                await response.json();

            updateStatistics();

            renderResources();

        } catch (error) {

            console.error(
                "Error loading resources:",
                error
            );

            const grid =
                document.getElementById(
                    "resourceGrid"
                );

            grid.innerHTML = `
                <div class="empty-state">
                    <h3>Unable to load resources</h3>
                    <p>
                        Please refresh the page and
                        try again.
                    </p>
                </div>
            `;

        }

    }


    /* ================================
       UPDATE STATISTICS
    ================================= */

    function updateStatistics() {

        const total =
            resources.length;

        const available =
            resources.filter(
                resource =>
                    resource.status === "AVAILABLE"
            ).length;

        const lowStock =
            resources.filter(
                resource =>
                    resource.status === "LOW_STOCK"
            ).length;

        const outOfStock =
            resources.filter(
                resource =>
                    resource.status === "OUT_OF_STOCK"
            ).length;


        document.getElementById(
            "totalResources"
        ).textContent = total;


        document.getElementById(
            "availableResources"
        ).textContent = available;


        document.getElementById(
            "lowStockResources"
        ).textContent = lowStock;


        document.getElementById(
            "outOfStockResources"
        ).textContent = outOfStock;

    }


    /* ================================
       RENDER RESOURCES
    ================================= */

    function renderResources() {

        const grid =
            document.getElementById(
                "resourceGrid"
            );


        const searchText =
            document.getElementById(
                "searchInput"
            ).value
                .trim()
                .toLowerCase();


        const category =
            document.getElementById(
                "categoryFilter"
            ).value;


        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filteredResources =
            resources.filter(resource => {

                const matchesSearch =
                    !searchText ||

                    String(
                        resource.name || ""
                    )
                        .toLowerCase()
                        .includes(searchText) ||

                    String(
                        resource.location || ""
                    )
                        .toLowerCase()
                        .includes(searchText) ||

                    String(
                        resource.category || ""
                    )
                        .toLowerCase()
                        .includes(searchText);


                const matchesCategory =
                    !category ||
                    resource.category === category;


                const matchesStatus =
                    !status ||
                    resource.status === status;


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesStatus
                );

            });


        if (
            filteredResources.length === 0
        ) {

            grid.innerHTML = `
                <div class="empty-state">
                    <h3>No resources found</h3>
                    <p>
                        Try changing your search
                        or filter options.
                    </p>
                </div>
            `;

            return;

        }


        grid.innerHTML =
            filteredResources
                .map(
                    resource =>
                        createResourceCard(resource)
                )
                .join("");

    }


    /* ================================
       RESOURCE CARD
    ================================= */

    function createResourceCard(resource) {

        const status =
            resource.status ||
            "AVAILABLE";


        const statusClass =
            status
                .toLowerCase()
                .replace(/_/g, "-");


        const displayStatus =
            status.replace(
                /_/g,
                " "
            );


        return `
            <div class="resource-card">

                <div class="resource-top">

                    <div class="resource-name">
                        ${escapeHtml(
                            resource.name
                        )}
                    </div>

                    <span
                        class="badge ${statusClass}"
                    >
                        ${escapeHtml(
                            displayStatus
                        )}
                    </span>

                </div>


                <div class="resource-info">

                    <div>
                        Category:
                        <strong>
                            ${escapeHtml(
                                resource.category
                            )}
                        </strong>
                    </div>

                    <div>
                        Quantity:
                        <strong>
                            ${escapeHtml(
                                resource.quantity
                            )}
                            ${escapeHtml(
                                resource.unit
                            )}
                        </strong>
                    </div>

                    <div>
                        Location:
                        <strong>
                            ${escapeHtml(
                                resource.location
                            )}
                        </strong>
                    </div>

                </div>


               <div class="resource-actions" style="${
    currentUserRole === "ADMIN" ||
    currentUserRole === "COORDINATOR"
        ? ""
        : "display: none;"
}">

                    <button
    type="button"
    class="action-btn status-btn"
    onclick="openStatusModal(
        ${resource.id},
        '${escapeJs(
            resource.name
        )}',
        '${escapeJs(
            status
        )}'
    )"
>
    Change Status
</button>


                    <button
                        type="button"
                        class="action-btn delete-btn"
                        onclick="deleteResource(
                            ${resource.id}
                        )"
                    >
                        Delete
                    </button>

                </div>

            </div>
        `;

    }


    /* ================================
       HTML ESCAPE
    ================================= */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ================================
       JAVASCRIPT STRING ESCAPE
    ================================= */

    function escapeJs(value) {

        return String(
            value ?? ""
        )
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '\\"'
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                "\\r"
            );

    }


    /* ================================
       ADD RESOURCE
       REAL BACKEND ENDPOINT
    ================================= */

 document
    .getElementById("resourceForm")
    ?.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

    const formData =
    new URLSearchParams();

                formData.append(
                    "name",
                    document
                        .getElementById("name")
                        .value
                        .trim()
                );


                formData.append(
                    "category",
                    document
                        .getElementById("category")
                        .value
                );


                formData.append(
                    "quantity",
                    document
                        .getElementById("quantity")
                        .value
                );


                formData.append(
                    "unit",
                    document
                        .getElementById("unit")
                        .value
                        .trim()
                );


                formData.append(
                    "location",
                    document
                        .getElementById("location")
                        .value
                        .trim()
                );


                try {

                    const response =
                        await fetch(
                            "/resource/add",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded"
                                },

                                body: formData
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to add resource"
                        );

                    }


                    document
                        .getElementById(
                            "resourceForm"
                        )
                        .reset();


                    showToast(
                        "Resource added successfully."
                    );


                    await loadResources();


                } catch (error) {

                    console.error(
                        "Add resource error:",
                        error
                    );


                    showToast(
                        "Unable to add resource.",
                        true
                    );

                }

            }
        );


    /* ================================
       SEARCH
    ================================= */

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            renderResources
        );


    /* ================================
       CATEGORY FILTER
    ================================= */

    document
        .getElementById("categoryFilter")
        .addEventListener(
            "change",
            renderResources
        );


    /* ================================
       STATUS FILTER
    ================================= */

    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            renderResources
        );


    /* ================================
       OPEN STATUS MODAL
    ================================= */

    function openStatusModal(
        id,
        resourceName,
        currentStatus
    ) {

        selectedResourceId = id;


        document
            .getElementById(
                "statusResourceName"
            )
            .textContent =
                `${resourceName} — Current status: ${
                    currentStatus.replace(
                        /_/g,
                        " "
                    )
                }`;


        document
            .getElementById(
                "newResourceStatus"
            )
            .value = currentStatus;


        document
            .getElementById(
                "statusModal"
            )
            .style.display = "flex";

    }


    /* ================================
       CLOSE STATUS MODAL
    ================================= */

    function closeStatusModal() {

        selectedResourceId = null;


        document
            .getElementById(
                "statusModal"
            )
            .style.display = "none";

    }


    /* ================================
       CANCEL STATUS
    ================================= */

    document
        .getElementById(
            "cancelStatusBtn"
        )
        .addEventListener(
            "click",
            closeStatusModal
        );


    /* ================================
       UPDATE STATUS
    ================================= */

    document
        .getElementById(
            "confirmStatusBtn"
        )
        .addEventListener(
            "click",
            async function() {

                if (
                    !selectedResourceId
                ) {

                    return;

                }


                const newStatus =
                    document
                        .getElementById(
                            "newResourceStatus"
                        )
                        .value;


                try {

                    const response =
                        await fetch(
                            `/api/resources/${selectedResourceId}/status?status=${encodeURIComponent(newStatus)}`,
                            {
                                method: "PUT"
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Status update failed"
                        );

                    }


                    closeStatusModal();


                    showToast(
                        "Resource status updated successfully."
                    );


                    await loadResources();


                } catch (error) {

                    console.error(
                        "Status update error:",
                        error
                    );


                    showToast(
                        "Unable to update resource status.",
                        true
                    );

                }

            }
        );


    /* ================================
       CLOSE MODAL OUTSIDE
    ================================= */

    document
        .getElementById(
            "statusModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeStatusModal();

                }

            }
        );


    /* ================================
       ESCAPE KEY
    ================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeStatusModal();

            }

        }
    );


    /* ================================
       DELETE RESOURCE
    ================================= */

    async function deleteResource(id) {

        const resource =
            resources.find(
                item =>
                    item.id === id
            );


        if (!resource) {

            return;

        }


        const confirmed =
            window.confirm(
                `Delete "${resource.name}"?\n\nThis action cannot be undone.`
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/resources/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            showToast(
                "Resource deleted successfully."
            );


            await loadResources();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            showToast(
                "Unable to delete resource.",
                true
            );

        }

    }


    /* ================================
       TOAST
    ================================= */

    function showToast(
        message,
        isError = false
    ) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent = message;


        toast.style.background =
            isError
                ? "#991b1b"
                : "#111827";


        toast.style.display =
            "block";


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                function() {

                    toast.style.display =
                        "none";

                },
                3000
            );

    }


    /* ================================
       INITIAL LOAD
    ================================= */

loadCurrentUser().then(async () => {
    await loadResources();
    applyRoleBasedResourceForm();
});
</script>
